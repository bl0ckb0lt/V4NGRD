name: V4NGRD digest

on:
  schedule:
    - cron: "0 9 * * *"   # daily digest, 09:00 UTC
    - cron: "0 9 * * 1"   # weekly digest, Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      period:
        description: "daily or weekly"
        required: false
        default: "daily"

concurrency:
  group: v4ngrd-state
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine period
        id: period
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.period }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 9 * * 1" ]; then
            echo "value=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "value=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Send digest
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python digest_runner.py "${{ steps.period.outputs.value }}"

      - name: Commit and push state
        run: |
          git config user.name "v4ngrd-bot"
          git config user.email "v4ngrd-bot@users.noreply.github.com"
          [ -e group_state.json ] && git add group_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: digest run [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
